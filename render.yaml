services:
  - type: web
    name: relaxscape-studio
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DAILY_VIDEO_HOUR
        value: "05:00"
      - key: DAILY_TIMEZONE
        value: "Europe/Madrid"
      - key: DAILY_WEB_URL
        value: https://relaxscape-studio.onrender.com

  - type: cron
    name: relaxscape-daily-video
    runtime: node
    schedule: "0 * * * *"
    buildCommand: npm install
    startCommand: node daily-cron.cjs
    envVars:
      - key: DAILY_WEB_URL
        value: https://relaxscape-studio.onrender.com
      - key: DAILY_VIDEO_HOUR
        value: "05:00"
      - key: DAILY_TIMEZONE
        value: "Europe/Madrid"
\n  - type: cron\n    name: relaxscape-youtube-daily\n    runtime: node\n    schedule: "0 7 * * *"\n    buildCommand: npm install\n    startCommand: node youtube-daily-cron.cjs\n    envVars:\n      - key: DAILY_WEB_URL\n        value: https://relaxscape-studio.onrender.com\n      - key: YOUTUBE_DAILY_MINUTES\n        value: "60"\n      - key: YOUTUBE_PUBLISH_SECRET\n        sync: false\n