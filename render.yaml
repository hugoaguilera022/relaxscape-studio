services:
  - type: web
    name: autotube-studio
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_TEXT_MODEL
        value: gemini-3.6-flash
      - key: HF_TOKEN
        sync: false
      - key: HF_TTS_MODEL
        value: facebook/mms-tts-spa
      - key: YOUTUBE_CLIENT_ID
        sync: false
      - key: YOUTUBE_CLIENT_SECRET
        sync: false
      - key: YOUTUBE_REFRESH_TOKEN
        sync: false
      - key: YOUTUBE_REDIRECT_URI
        sync: false
      - key: AUTOMATION_SECRET
        sync: false
      - key: AUTOMATION_NICHE
        value: historias sorprendentes, curiosidades y explicaciones visuales de cosas que la mayoría de personas no conoce
      - key: AUTOMATION_MINUTES
        value: "7"
