name: Apply image diagnostics

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch diagnostics
        shell: python
        run: |
          from pathlib import Path

          p = Path("public/app.js")
          s = p.read_text()

          old = '''function loadAIImagesSequentially(){
  const next=()=>{'''
          new = '''function loadAIImagesSequentially(){
  console.groupCollapsed("[RelaxScape AI] Carga de 4 imágenes");
  console.log("[AI Images] Iniciando carga secuencial. Tarjetas esperadas:", document.querySelectorAll("#aiImageGrid .ai-photo").length);
  const next=()=>{'''
          if old in s and new not in s:
            s=s.replace(old,new,1)

          old = '''    const card=cards[index];
    const img=card.querySelector("img");
    const src=img?.dataset?.src;'''
          new = '''    const card=cards[index];
    const img=card.querySelector("img");
    const src=img?.dataset?.src;
    console.log("[AI Images] Cargando", (index+1)+"/"+cards.length, {
      url: src,
      name: card.dataset.name
    });'''
          if old in s and new not in s:
            s=s.replace(old,new,1)

          old = '''      finished=true;
      img.dataset.loaded="1";
      setTimeout(next,800);'''
          new = '''      finished=true;
      img.dataset.loaded="1";
      console.log("[AI Images] ✓ Imagen", (index+1)+"/"+cards.length, "cargada correctamente", {
        src: img.currentSrc || img.src
      });
      if(index===cards.length-1) console.log("[AI Images] ✓ RESUMEN: las 4 tarjetas terminaron su carga.");
      setTimeout(next,800);'''
          if old in s and new not in s:
            s=s.replace(old,new,1)

          old = '''    const retry=()=>{
      if(finished)return;
      attempts++;'''
          new = '''    const retry=()=>{
      if(finished)return;
      attempts++;
      console.warn("[AI Images] ⚠ Fallo imagen", (index+1)+"/"+cards.length, "intento", attempts, {
        url: src,
        complete: img.complete,
        naturalWidth: img.naturalWidth,
        naturalHeight: img.naturalHeight
      });'''
          if old in s and new not in s:
            s=s.replace(old,new,1)

          old = '''      setTimeout(advance,300);
    };
    img.onload=advance;'''
          new = '''      console.error("[AI Images] ✗ Imagen", (index+1)+"/"+cards.length, "falló después de 3 reintentos. Se usa fallback local.", src);
      setTimeout(advance,300);
    };
    img.onload=advance;'''
          if old in s and new not in s:
            s=s.replace(old,new,1)

          old = '''    img.src=src;
    setTimeout(()=>{if(!finished&&!img.complete)retry()},70000);'''
          new = '''    img.src=src;
    console.log("[AI Images] → Request iniciada:", (index+1)+"/"+cards.length, src);
    setTimeout(()=>{if(!finished&&!img.complete){
      console.warn("[AI Images] ⏱ Timeout 70s en imagen", (index+1)+"/"+cards.length);
      retry();
    }},70000);'''
          if old in s and new not in s:
            s=s.replace(old,new,1)

          p.write_text(s)

          p = Path("server/index.js")
          s = p.read_text()
          old = '''    const results = [];
    for(let index=0; index<requestedCount; index++){'''
          new = '''    const results = [];
    console.log("[AI Images] Solicitud recibida:", {theme, requestedCount});
    for(let index=0; index<requestedCount; index++){'''
          if old in s and new not in s:
            s=s.replace(old,new,1)

          old = '''        const image=await generatePollinationsLandscape(theme,index);
        results.push({ok:true,image});'''
          new = '''        const image=await generatePollinationsLandscape(theme,index);
        console.log("[AI Images] URL", index+1+"/"+requestedCount, image.url);
        results.push({ok:true,image});'''
          if old in s and new not in s:
            s=s.replace(old,new,1)

          old = '''      }catch(error){
        results.push({ok:false,error});'''
          new = '''      }catch(error){
        console.error("[AI Images] ERROR imagen", index+1+"/"+requestedCount, error?.stack || error?.message || error);
        results.push({ok:false,error});'''
          if old in s and new not in s:
            s=s.replace(old,new,1)

          old = '''    return res.json({
      images,
      provider:'''
          new = '''    console.log("[AI Images] Respuesta final:", images.map((x,i)=>({
      index:i+1,
      name:x.name,
      provider:x.provider,
      remote:x.remote,
      url:x.url
    })));
    return res.json({
      images,
      provider:'''
          if old in s and new not in s:
            s=s.replace(old,new,1)

          p.write_text(s)

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app.js server/index.js
          git diff --cached --quiet || git commit -m "Add detailed AI image diagnostics"
          git push
